# ===========================
# Tmux Config - Full Version
# ===========================

# --- General Options ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# set -g default-terminal "tmux-256color"
# set -a terminal-features "tmux-256color:RGB"
# set -as terminal-overrides ',*:Tc'
set -g escape-time 0
set -g history-limit 100000
set -g mouse on
# Allow windows to be auto-renamed by active process
# set -g allow-rename on

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 2

# Optional: Automatically renumber windows sequentially after closing one
set -g renumber-windows on

set -gq allow-passthrough on

# --- Prefix Key ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload Tmux config (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# --- Maximize/Minimize current pane (Prefix + m) ---
bind m resize-pane -Z

# --- Pane Navigation ---
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# --- Resize Panes with Alt + Arrows ---
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# --- Split Panes ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# -- Popup Pane
# bind f display-popup -d "#{pane_current_path}"
bind f display-popup -w 95% -h 95% -d "#{pane_current_path}" -E 'bash -c '\''SESSION="popup-$(basename "$PWD")"; exec tmux new-session -A -s "$SESSION"'\'''

unbind '"'
unbind %

# --- Window Management ---
bind c new-window -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane
# bind , rename-window
bind . move-window
bind w choose-window
bind p previous-window
bind n next-window

# --- Status Bar (Vague Theme) ---
set -g status-position top
set -g status-interval 2
set -g status-justify centre

set -g status-style "bg=#1a1a1a,fg=#bdbdbd"
set -g status-left-style "bg=#1a1a1a,fg=#bdbdbd"
set -g status-right-style "bg=#1a1a1a,fg=#bdbdbd"

# --- Popup ---
# set -g popup-border-style fg=#555555
# set -g popup-style bg=#1e1e1e

set -g status-left-length 80
set -g status-right-length 40

# Left: Session + Current Folder
set -g status-left "#[fg=#8fa1b3,bold] #S #[fg=#6b6b6b]| #[fg=#c1c1c1] #(basename #{pane_current_path}) #[default]"

# Right: Date / Time
set -g status-right "#[fg=#8fa1b3] %H:%M#[default] "

# # Inactive windows
# setw -g window-status-format "#[fg=#6b6b6b,bg=#141414] #I:#W #[default]"
#
# # Active window
# setw -g window-status-current-format "#[fg=#c1c1c1,bg=#262626,bold] #I:#W #[default]"


# janela inativa
set -g window-status-format " #I:#W "
set -g window-status-style "bg=#2b2b2b,fg=#9a9a9a"

# janela ativa
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#ffffff,fg=#000000,bold"


# Separator
set -g window-status-separator " "

# --- Copy Mode (Vim keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# --- TPM Init ---
run '~/.tmux/plugins/tpm/tpm'
